<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 157.5 H 1200 M 0 315 H 1200 M 0 472.5 H 1200 M 300 0 V 630 M 600 0 V 630 M 900 0 V 630" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="600" cy="270" r="350" fill="url(#glow)"/>

  <!-- PEAK Brand Group -->
  <g transform="translate(600, 240)">
    <!-- PEAK Wordmark -->
    <g transform="translate(0, 0)">
      <text x="-190" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="-2">PE</text>
      <!-- Mountain Peak SVG inside PEAK -->
      <path d="M -30 35 L 20 -40 L 45 0 L 90 -105 L 130 35 L 85 35 L 70 0 L 50 35 Z" fill="#FF1E27" stroke="#FF1E27" stroke-width="3" stroke-linejoin="round"/>
      <text x="145" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="-2">K</text>
    </g>

    <!-- PERFORMANCE -->
    <text x="0" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#FFD700" letter-spacing="14">PERFORMANCE</text>

    <!-- SOLVE. ENHANCE. DOMINATE. -->
    <text x="0" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#A0A0A0" letter-spacing="8">SOLVE. ENHANCE. DOMINATE.</text>
  </g>

  <!-- Tagline / Badge -->
  <rect x="360" y="490" width="480" height="54" rx="6" fill="#FF1E27" fill-opacity="0.1" stroke="#FF1E27" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" letter-spacing="3">FEMALE ATHLETE RECOVERY LAB</text>
</svg>
